<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wardrobe rotation</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="app-version" content="20260726021035">
<script>
// GitHub Pages serves through a CDN whose edge nodes only refresh their
// cached copy the NEXT time a request reaches them after a deploy. That
// means the very first request after an update — including this script's
// own background version check below — can get served the same stale
// copy as the initial page load, so a simple version comparison can be
// fooled: both sides look identical because both are stale.
//
// To handle that specific case, on the first visit each browser session
// we unconditionally force one hard, cache-busting reload — this mirrors
// exactly what manually refreshing twice does, and "warms" the edge node
// so this and all subsequent loads this session get the real, current
// version. After that warm-up has happened once, we fall back to the
// normal version-check below to catch any later deploys during the same
// session.
(function(){
  try {
    if (!sessionStorage.getItem('wardrobe-warmed')) {
      sessionStorage.setItem('wardrobe-warmed', '1');
      window.location.replace(window.location.pathname + '?_warm=' + Date.now());
      return; // don't bother with the version check below on this pass
    }
  } catch(e) { /* ignore — never block the app from loading over this */ }
})();

// Actively checks whether a newer version of this page has been deployed
// (e.g. after re-uploading a new index.html to GitHub Pages) and forces a
// fresh reload if so. This is more reliable than cache-control meta tags,
// since it doesn't depend on the browser choosing to respect them — it
// explicitly fetches the live file bypassing cache and compares versions.
(function(){
  try {
    var CURRENT_VERSION = document.querySelector('meta[name="app-version"]').content;
    var cacheBustUrl = window.location.pathname + '?_cb=' + Date.now();
    fetch(cacheBustUrl, { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var match = html.match(/<meta name="app-version" content="([^"]+)"/);
        if (!match || !match[1] || match[1] === CURRENT_VERSION) return;
        var newVersion = match[1];
        var reloadKey = 'wardrobe-reload-check-' + newVersion;
        if (sessionStorage.getItem(reloadKey)) return; // avoid reload loops
        sessionStorage.setItem(reloadKey, '1');
        window.location.replace(window.location.pathname + '?_v=' + encodeURIComponent(newVersion));
      })
      .catch(function(){ /* offline or blocked — just proceed with current page */ });
  } catch(e) { /* ignore — never block the app from loading over this */ }
})();
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F6F1E7;
    --paper:#FCFAF5;
    --ink:#241F19;
    --muted:#8A8073;
    --line:#E4DCCB;
    --clay:#A85C32;
    --clay-dark:#7C4322;
    --clay-tint:#F1E1D3;
    --sage:#5C7A5C;
    --sage-tint:#E4EBE1;
    --rust:#B0472E;
    --rust-tint:#F5DFD8;
    --plum:#6B5B7E;
    --plum-tint:#E9E4EE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}
  .hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:2rem;flex-wrap:wrap;}
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:34px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .sub{color:var(--muted);font-size:14px;margin:0;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:2rem;}
  .stat{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px 16px;
  }
  .stat .n{font-family:'Fraunces',serif;font-size:26px;font-weight:600;line-height:1;}
  .stat .l{font-size:12px;color:var(--muted);margin-top:6px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:1.25rem;}
  .tab{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:500;
    padding:10px 4px;
    margin-right:20px;
    background:none;
    border:none;
    color:var(--muted);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
    top:1px;
  }
  .tab.active{color:var(--ink);border-bottom-color:var(--clay);}
  .controls{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center;}
  .search{
    flex:1;min-width:180px;
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  .search:focus{outline:none;border-color:var(--clay);}
  select, input[type="text"]{
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--paper);
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
  }
  .sortline{font-size:12px;color:var(--muted);margin-bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px 14px 14px;
    position:relative;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card::before{
    content:'';
    position:absolute;
    left:0; top:14px; bottom:14px;
    width:4px;
    border-radius:0 3px 3px 0;
    background:var(--tagcolor,#ccc);
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding-left:6px;}
  .swatch{
    width:14px;height:14px;border-radius:50%;
    border:1px solid rgba(0,0,0,0.15);
    flex-shrink:0;
    margin-top:3px;
  }
  .titles{flex:1;}
  .brand{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;}
  .name{font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin-top:1px;}
  .meta{font-size:12px;color:var(--muted);padding-left:6px;}
  .item-note{
    font-size:12px;color:var(--ink);padding-left:6px;
    font-style:italic; opacity:0.85;
    white-space:pre-wrap; word-break:break-word;
  }
  code.tagcode{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);}
  .status-row{display:flex;justify-content:space-between;align-items:center;padding-left:6px;margin-top:2px;flex-wrap:wrap;gap:6px;}
  .pill{
    font-size:11px;
    font-weight:500;
    padding:3px 9px;
    border-radius:20px;
    white-space:nowrap;
  }
  .pill.overdue{background:var(--rust-tint);color:var(--rust);}
  .pill.recent{background:var(--sage-tint);color:var(--sage);}
  .pill.reserve{background:var(--plum-tint);color:var(--plum);}
  .btn-row{display:flex;gap:6px;flex-wrap:wrap;padding-left:6px;}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:500;
    padding:7px 12px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
  }
  .btn:hover{background:var(--cream);}
  .btn.primary{
    background:var(--clay);
    border-color:var(--clay);
    color:#fff;
  }
  .btn.primary:hover{background:var(--clay-dark);}
  .btn.primary:disabled{background:var(--sage);border-color:var(--sage);cursor:default;opacity:0.85;}
  .btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:7px 8px;}
  .btn.ghost:hover{color:var(--rust);background:var(--rust-tint);}
  .btn.small{font-size:11px;padding:5px 9px;}
  details.history{padding-left:6px;}
  details.history summary{
    font-size:11px;color:var(--muted);cursor:pointer;list-style:none;
    display:flex;align-items:center;gap:4px;
  }
  details.history summary::-webkit-details-marker{display:none;}
  details.history summary::before{content:'\25B8';font-size:10px;transition:transform .15s;}
  details.history[open] summary::before{transform:rotate(90deg);}
  .history-dates{
    margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;
  }
  .history-dates span{
    font-size:11px;color:var(--muted);background:var(--cream);
    border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 7px;
    display:inline-flex;align-items:center;gap:2px;
  }
  .date-x{
    background:none;border:none;color:var(--muted);cursor:pointer;
    font-size:13px;line-height:1;padding:0 4px;
  }
  .date-x:hover{color:var(--rust);}
  .backdate-row{display:flex;gap:6px;align-items:center;padding-left:6px;margin-top:2px;}
  .backdate-row input[type="date"]{font-size:12px;padding:6px 8px;flex:1;min-width:0;}
  .empty{
    text-align:center;
    padding:3rem 1rem;
    color:var(--muted);
    font-size:14px;
  }
  .footer-note{
    margin-top:2.5rem;
    padding-top:1.25rem;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:1rem;
    flex-wrap:wrap;
  }
  .linklike{
    background:none;border:none;color:var(--clay);
    font-size:12px;cursor:pointer;padding:0;
    text-decoration:underline;
    font-family:'Inter',sans-serif;
  }
  .edit-form{display:flex;flex-direction:column;gap:8px;padding-left:6px;}
  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .edit-grid input{width:100%;font-size:12px;padding:6px 8px;}
  .edit-actions{display:flex;gap:6px;}
  .add-panel{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px;
    margin-bottom:1.25rem;
    display:none;
  }
  .add-panel.open{display:block;}
  .add-panel h3{font-family:'Fraunces',serif;font-size:16px;font-weight:500;margin:0 0 12px;}
  .thumb{
    width:44px;height:44px;border-radius:8px;
    object-fit:cover;flex-shrink:0;
    border:1px solid rgba(0,0,0,0.1);
  }
  .thumb-preview{
    width:80px;height:80px;border-radius:10px;
    object-fit:cover;
    border:1px solid var(--line);
  }
  .photo-preview-row{display:flex;align-items:center;gap:10px;}
  .photo-remove{font-size:12px;color:var(--rust);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;}
  .swatch-picker{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:8px;
  }
  .swatch-pick{
    width:22px;height:22px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
    box-shadow:0 0 0 1px rgba(0,0,0,0.12);
  }
  .swatch-pick.selected{
    border-color:var(--clay);
    box-shadow:0 0 0 1px var(--clay);
  }
  .add-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
  .add-grid label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
  .add-grid input, .add-grid select{width:100%;}
  .checkbox-row{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:12px;}
  .add-actions{display:flex;gap:8px;}
  @media (max-width:600px){
    .stats{grid-template-columns:repeat(2,1fr);}
    h1{font-size:28px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div>
      <h1>Wardrobe rotation</h1>
      <p class="sub" id="todayline">Loading…</p>
    </div>
    <button class="btn primary" id="toggleAddBtn">Add item</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="add-panel" id="addPanel">
    <h3>Add a new item</h3>
    <div class="add-grid">
      <div>
        <label for="f-brand">Brand</label>
        <input type="text" id="f-brand" placeholder="e.g. Lacoste">
      </div>
      <div>
        <label for="f-type">Type</label>
        <input type="text" id="f-type" placeholder="e.g. Regular fit polo">
      </div>
      <div style="grid-column:1/-1;">
        <label for="f-color">Color</label>
        <input type="text" id="f-color" placeholder="e.g. Navy, Slate, Dusty Rose…" list="colorSuggestions">
        <datalist id="colorSuggestions"></datalist>
        <input type="hidden" id="f-swatch-color" value="">
        <p style="font-size:11px;color:var(--muted);margin:8px 0 2px;">Pick the closest swatch for the display dot/stripe (optional — doesn't change the text above)</p>
        <div class="swatch-picker" id="f-color-picker"></div>
      </div>
      <div>
        <label for="f-material">Material</label>
        <input type="text" id="f-material" placeholder="e.g. Cotton + elastane">
      </div>
      <div>
        <label for="f-code">Item code (optional)</label>
        <input type="text" id="f-code" placeholder="e.g. PH5522">
      </div>
      <div>
        <label for="f-purchased">Purchased (month/year, optional)</label>
        <input type="month" id="f-purchased">
      </div>
      <div style="grid-column:1/-1;">
        <label for="f-notes">Notes (optional)</label>
        <textarea id="f-notes" rows="2" style="width:100%;font-family:'Inter',sans-serif;font-size:13px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;" placeholder="Fit notes, alterations, where you bought it..."></textarea>
      </div>
      <div style="grid-column:1/-1;">
        <label for="f-photo-input">Photo (optional)</label>
        <input type="file" accept="image/*" id="f-photo-input">
        <input type="hidden" id="f-photo" value="">
        <div class="checkbox-row" style="margin:6px 0 0;">
          <input type="checkbox" id="f-remove-bg" checked>
          <label for="f-remove-bg" style="font-size:12px;">Remove background (best for plain product photos)</label>
        </div>
        <div id="f-photo-preview" style="margin-top:8px;"></div>
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="f-isnew">
      <label for="f-isnew">Keep as brand new (reserve)</label>
    </div>
    <div class="add-actions">
      <button class="btn primary" id="saveItemBtn">Save item</button>
      <button class="btn" id="cancelAddBtn">Cancel</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="active" id="tab-active">Active rotation</button>
    <button class="tab" data-tab="reserve" id="tab-reserve">Reserve (new)</button>
  </div>

  <div class="controls">
    <input class="search" id="search" placeholder="Search brand, type, color, code…">
    <select id="filterColor"><option value="">All colors</option></select>
    <select id="filterBrand"><option value="">All brands</option></select>
    <select id="filterPurchaseYear"><option value="">All purchase years</option></select>
    <select id="sortMode">
      <option value="overdue">Sort: most overdue</option>
      <option value="last-worn">Sort: last worn</option>
      <option value="most-worn">Sort: most worn</option>
      <option value="least-worn">Sort: least worn</option>
      <option value="purchased-newest">Sort: recently purchased</option>
      <option value="purchased-oldest">Sort: oldest purchased</option>
    </select>
  </div>

  <p class="sortline">
    <span id="sortlinetext"></span>
  </p>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No items match this filter.</div>

  <div class="footer-note">
    <span id="storagenote">Loading…</span>
    <span style="display:flex; gap:14px;">
      <button class="linklike" id="exportBtn">Export data</button>
      <button class="linklike" id="importBtn">Import data</button>
      <button class="linklike" id="resetBtn">Clear all wear history</button>
    </span>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none;">
</div>

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function isoFromDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function startOfWeekISO(offsetWeeks){
  // Monday-start week, using local time. offsetWeeks=0 is this week, -1 is last week, etc.
  offsetWeeks = offsetWeeks || 0;
  const d = new Date();
  const dow = d.getDay(); // 0 = Sunday ... 6 = Saturday
  const diffToMonday = dow === 0 ? 6 : dow - 1;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday + (offsetWeeks * 7));
  return isoFromDate(monday);
}

function daysSince(iso){
  const then = new Date(iso + 'T00:00:00');
  const now = new Date(todayISO() + 'T00:00:00');
  return Math.round((now - then) / 86400000);
}

function formatDate(iso){
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

// Formats a "YYYY-MM" string (from <input type="month">) into "Mon YYYY",
// e.g. "2026-07" -> "Jul 2026". Deliberately never carries a day component.
function formatMonthYear(ym){
  if (!ym) return '';
  const [y, m] = ym.split('-').map(Number);
  const d = new Date(y, m - 1, 1);
  return d.toLocaleDateString(undefined, { month:'short', year:'numeric' });
}

// Crops an uploaded image to a centered square, shrinks it, and compresses
// it to a small JPEG data URL — small enough to store inline alongside the
// rest of the item's data (no separate file hosting needed).
// Removes a plain, light background from a canvas in place, using a
// flood fill that starts only at edge pixels which are already
// light/near-white — so it never eats into white DETAILS inside the
// garment (like piping or a logo), only true background connected to
// the image border. Works well for clean product photos; does nothing
// useful on busy/textured backgrounds (by design — it just won't find a
// light starting point to flood from).
function removeBackgroundFromCanvas(canvas, tolerance){
  tolerance = tolerance || 20; // combined RGB distance allowed per step (conservative)
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const n = w * h;
  const visited = new Uint8Array(n);
  const toRemove = new Uint8Array(n);
  const qx = new Int32Array(n);
  const qy = new Int32Array(n);

  // Stricter than before: only near-PURE white/light-grey counts as
  // background. Pale/pastel garments (soft yellow, light pink, etc.)
  // should fail this on purpose, so the flood fill can never start
  // inside them or spread through them.
  function isLight(r, g, b){
    return r > 232 && g > 232 && b > 232 && (Math.max(r,g,b) - Math.min(r,g,b)) < 12;
  }

  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const onBorder = x === 0 || y === 0 || x === w - 1 || y === h - 1;
      if (!onBorder) continue;
      const i = y * w + x;
      if (visited[i]) continue;
      const di = i * 4;
      const r = data[di], g = data[di+1], b = data[di+2];
      if (!isLight(r, g, b)) continue;

      let head = 0, tail = 0;
      qx[tail] = x; qy[tail] = y; tail++;
      visited[i] = 1;
      const seedR = r, seedG = g, seedB = b;

      while (head < tail){
        const cx = qx[head], cy = qy[head]; head++;
        const ci = cy * w + cx;
        toRemove[ci] = 1;
        const neighbors = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
        for (let k = 0; k < 4; k++){
          const nx = neighbors[k][0], ny = neighbors[k][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const ni = ny * w + nx;
          if (visited[ni]) continue;
          const ndi = ni * 4;
          const nr = data[ndi], ng = data[ndi+1], nb = data[ndi+2];
          // Double safeguard: the candidate pixel must (a) be close to
          // the original seed color, AND (b) independently qualify as
          // "light" itself — this stops the fill from drifting through
          // a soft gradient into genuinely-colored fabric.
          const dist = Math.abs(nr-seedR) + Math.abs(ng-seedG) + Math.abs(nb-seedB);
          if (dist <= tolerance && isLight(nr, ng, nb)){
            visited[ni] = 1;
            qx[tail] = nx; qy[tail] = ny; tail++;
          }
        }
      }
    }
  }

  for (let i = 0; i < n; i++){
    if (toRemove[i]) data[i*4 + 3] = 0;
  }
  ctx.putImageData(imgData, 0, 0);
}

// Finds the garment's bounding box while ignoring small disconnected
// background-removal noise specks (which would otherwise skew the
// detected center — verified this was the actual cause of asymmetric
// crops on some photos). Groups opaque pixels into connected regions via
// flood fill, keeps only regions that are a meaningful fraction of the
// largest one, and also zeroes out the noise pixels themselves so they
// don't show up as stray artifacts in the final thumbnail.
function getCleanedGarmentBBox(canvas, minComponentFrac){
  minComponentFrac = minComponentFrac == null ? 0.02 : minComponentFrac;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const n = w * h;
  const labels = new Int32Array(n);
  const sizes = [];
  const qx = new Int32Array(n), qy = new Int32Array(n);
  let currentLabel = 0;

  function isOpaque(i){ return data[i * 4 + 3] > 30; }

  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i = y * w + x;
      if (labels[i] !== 0 || !isOpaque(i)) continue;
      currentLabel++;
      let head = 0, tail = 0;
      qx[tail] = x; qy[tail] = y; tail++;
      labels[i] = currentLabel;
      let count = 0;
      while (head < tail){
        const cx = qx[head], cy = qy[head]; head++;
        count++;
        const neighbors = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
        for (let k = 0; k < 4; k++){
          const nx = neighbors[k][0], ny = neighbors[k][1];
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const ni = ny * w + nx;
          if (labels[ni] !== 0 || !isOpaque(ni)) continue;
          labels[ni] = currentLabel;
          qx[tail] = nx; qy[tail] = ny; tail++;
        }
      }
      sizes.push(count);
    }
  }

  if (sizes.length === 0) return null;
  const maxSize = Math.max.apply(null, sizes);
  const keep = new Set();
  for (let i = 0; i < sizes.length; i++){
    if (sizes[i] >= maxSize * minComponentFrac) keep.add(i + 1);
  }

  let minX = w, maxX = -1, minY = h, maxY = -1;
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const i = y * w + x;
      const lbl = labels[i];
      if (lbl !== 0 && keep.has(lbl)){
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      } else if (isOpaque(i)){
        data[i * 4 + 3] = 0; // scrub noise speck
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);
  if (maxX < 0) return null;
  return { minX, maxX, minY, maxY };
}

// Crops a (background-removed) canvas to the top portion of the garment
// (collar/chest area). Two steps: tighten to the WHOLE garment first (a
// reliable, well-centered anchor), then take the top fraction of that
// height for the "top half of the shirt" framing, squared off using the
// whole garment's own known-centered width.
//
// Deliberately does NOT re-detect a second, narrower bounding box within
// just the thin top slice — a shoulder or sleeve edge poking into that
// thin band can skew its center badly (verified: it dragged the crop ~8%
// off-center on a real test photo), cutting off one side of the collar.
// The whole-garment bbox is far more stable to center on.
function cropToTightGarmentSquare(canvas, topFrac, padFrac){
  topFrac = topFrac == null ? 0.88 : topFrac;
  padFrac = padFrac == null ? 0.03 : padFrac;

  const bbox = getCleanedGarmentBBox(canvas);
  if (!bbox) return canvas;

  const w = canvas.width, h = canvas.height;
  const bw0 = bbox.maxX - bbox.minX, bh0 = bbox.maxY - bbox.minY;
  const mx = Math.round(bw0 * padFrac), my = Math.round(bh0 * padFrac);
  const bx0 = Math.max(0, bbox.minX - mx), by0 = Math.max(0, bbox.minY - my);
  const bx1 = Math.min(w, bbox.maxX + mx), by1 = Math.min(h, bbox.maxY + my);
  const bw = bx1 - bx0, bh = by1 - by0;

  // Step 1: whole-garment tight crop (reliable center)
  const body = document.createElement('canvas');
  body.width = bw; body.height = bh;
  body.getContext('2d').drawImage(canvas, bx0, by0, bw, bh, 0, 0, bw, bh);

  // Step 2: top fraction of the garment's own height
  const sliceH = Math.max(1, Math.round(bh * topFrac));

  // Step 3: square-crop centered on the WHOLE garment's width (not a
  // re-detected slice-local bbox)
  const side = Math.min(bw, sliceH);
  const left = Math.round((bw - side) / 2);

  const out = document.createElement('canvas');
  out.width = side; out.height = side;
  out.getContext('2d').drawImage(body, left, 0, side, side, 0, 0, side, side);
  return out;
}

function fileToThumbnail(file, size, quality, removeBg){
  size = size || 200;
  quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        let sourceCanvas = null;

        if (removeBg){
          // Do background removal at a moderate working resolution first —
          // more accurate edges than removing it after heavy downscaling.
          const workMax = 600;
          const scale = Math.min(1, workMax / Math.max(img.width, img.height));
          const ww = Math.max(1, Math.round(img.width * scale));
          const wh = Math.max(1, Math.round(img.height * scale));
          const work = document.createElement('canvas');
          work.width = ww; work.height = wh;
          work.getContext('2d').drawImage(img, 0, 0, ww, wh);
          removeBackgroundFromCanvas(work);
          sourceCanvas = cropToTightGarmentSquare(work);
        }

        const srcW = sourceCanvas ? sourceCanvas.width : img.width;
        const srcH = sourceCanvas ? sourceCanvas.height : img.height;
        const side = Math.min(srcW, srcH);
        const sx = (srcW - side) / 2;
        const sy = (srcH - side) / 2;

        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(sourceCanvas || img, sx, sy, side, side, 0, 0, size, size);

        resolve(removeBg ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 1. Supabase — shared across every device, so this is the real fix for
//    phone/desktop being out of sync.
// 2. Claude's built-in storage — used only when running inside a Claude
//    artifact viewer and Supabase isn't reachable.
// 3. The browser's own localStorage — single-device fallback if offline.
// 4. In-memory only, as a last resort.
// Export/Import still works as a manual backup on top of all of this.
function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

async function supabaseGet(key){
  const url = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`;
  const resp = await withTimeout(fetch(url, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  }), 4000);
  if (!resp.ok) throw new Error('supabase get ' + resp.status);
  const rows = await resp.json();
  return rows.length ? JSON.stringify(rows[0].value) : null;
}

async function supabaseSet(key, value){
  const url = `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=key`;
  const resp = await withTimeout(fetch(url, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify([{ key, value: JSON.parse(value), updated_at: new Date().toISOString() }])
  }), 4000);
  if (!resp.ok) throw new Error('supabase set ' + resp.status);
}

async function storageGet(key){
  if (SUPABASE_URL && SUPABASE_KEY){
    try {
      const v = await supabaseGet(key);
      storageMode = 'supabase';
      let localV = null;
      try { localV = localStorage.getItem('wardrobe:' + key); } catch(e){}

      if (v != null){
        // Supabase has data — it's the source of truth. Refresh the local cache.
        try { localStorage.setItem('wardrobe:' + key, v); } catch(e){}
        return v;
      }
      if (localV){
        // Supabase has nothing yet, but this browser has real cached data
        // (e.g. from before Supabase was wired in). Never discard it —
        // push it up to Supabase so it becomes the shared copy instead.
        try { await supabaseSet(key, localV); } catch(e){ /* will retry on next save */ }
        return localV;
      }
      return null;
    } catch(e){ /* fall through */ }
  }
  if (window.storage && typeof window.storage.get === 'function'){
    try {
      const r = await withTimeout(window.storage.get(key, false), 2500);
      storageMode = 'claude';
      return r ? r.value : null;
    } catch(e){ /* fall through */ }
  }
  try {
    const v = localStorage.getItem('wardrobe:' + key);
    storageMode = storageMode === 'supabase' ? 'supabase-offline' : 'local';
    return v || null;
  } catch(e){
    storageMode = 'memory';
    return null;
  }
}

async function storageSet(key, value){
  let supabaseOk = false;
  if (SUPABASE_URL && SUPABASE_KEY){
    try {
      await supabaseSet(key, value);
      storageMode = 'supabase';
      supabaseOk = true;
    } catch(e){ /* fall through */ }
  }
  // always keep a local cache too, so the app still works offline
  try {
    localStorage.setItem('wardrobe:' + key, value);
    if (!supabaseOk) storageMode = 'local';
  } catch(e){
    if (!supabaseOk) storageMode = 'memory';
  }
  if (!supabaseOk && window.storage && typeof window.storage.set === 'function'){
    try {
      await withTimeout(window.storage.set(key, value, false), 2500);
      storageMode = 'claude';
    } catch(e){ /* fall through */ }
  }
}

async function loadState(){
  const w = await storageGet('wearlog');
  wearlog = w ? JSON.parse(w) : {};
  // migrate legacy format where wearlog[id] was a single date string
  Object.keys(wearlog).forEach(id => {
    if (typeof wearlog[id] === 'string') wearlog[id] = [wearlog[id]];
  });
  const a = await storageGet('activated');
  activated = a ? JSON.parse(a) : {};
  const c = await storageGet('customItems');
  customItems = c ? JSON.parse(c) : [];
  const d = await storageGet('deletedIds');
  deletedIds = d ? JSON.parse(d) : {};
  const ov = await storageGet('overrides');
  overrides = ov ? JSON.parse(ov) : {};
  const pd = await storageGet('purchasedDates');
  purchasedDates = pd ? JSON.parse(pd) : {};
  const notes = await storageGet('itemNotes');
  itemNotes = notes ? JSON.parse(notes) : {};
}

async function saveWearlog(){ await storageSet('wearlog', JSON.stringify(wearlog)); }
async function saveActivated(){ await storageSet('activated', JSON.stringify(activated)); }
async function saveCustomItems(){ await storageSet('customItems', JSON.stringify(customItems)); }
async function saveDeletedIds(){ await storageSet('deletedIds', JSON.stringify(deletedIds)); }
async function saveOverrides(){ await storageSet('overrides', JSON.stringify(overrides)); }
async function savePurchasedDates(){ await storageSet('purchasedDates', JSON.stringify(purchasedDates)); }
async function saveItemNotes(){ await storageSet('itemNotes', JSON.stringify(itemNotes)); }

function updateStorageNote(){
  const el = document.getElementById('storagenote');
  if (storageMode === 'supabase'){
    el.textContent = 'Synced across your devices via Supabase.';
  } else if (storageMode === 'supabase-offline'){
    el.textContent = 'Couldn\'t reach Supabase right now — showing your last synced data from this browser. Changes will retry syncing on your next action.';
  } else if (storageMode === 'claude'){
    el.textContent = 'Wear history is saved to your Claude account and only visible to you.';
  } else if (storageMode === 'local'){
    el.textContent = 'Wear history is saved in this browser only. Export it if you switch devices or browsers.';
  } else {
    el.textContent = 'This browser blocked local storage — your changes won\'t be saved. Export data after each session instead.';
  }
}

function downloadJSON(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

async function handleExport(){
  downloadJSON('wardrobe-rotation-backup.json', {
    exportedAt: new Date().toISOString(),
    wearlog, activated, customItems, deletedIds, overrides, purchasedDates, itemNotes
  });
}

async function handleImportFile(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.wearlog){
      Object.keys(data.wearlog).forEach(id => {
        const incoming = Array.isArray(data.wearlog[id]) ? data.wearlog[id] : [data.wearlog[id]];
        const existing = Array.isArray(wearlog[id]) ? wearlog[id] : [];
        wearlog[id] = [...new Set([...existing, ...incoming])].sort();
      });
    }
    if (data.activated) activated = { ...activated, ...data.activated };
    if (data.customItems) {
      const existingIds = new Set(customItems.map(i => i.id));
      data.customItems.forEach(i => { if (!existingIds.has(i.id)) customItems.push(i); });
    }
    if (data.deletedIds) deletedIds = { ...deletedIds, ...data.deletedIds };
    if (data.overrides) overrides = { ...overrides, ...data.overrides };
    if (data.purchasedDates) purchasedDates = { ...purchasedDates, ...data.purchasedDates };
    if (data.itemNotes) itemNotes = { ...itemNotes, ...data.itemNotes };
    await Promise.all([saveWearlog(), saveActivated(), saveCustomItems(), saveDeletedIds(), saveOverrides(), savePurchasedDates(), saveItemNotes()]);
    updateStorageNote();
    populateFilters();
    render();
    alert('Import complete.');
  } catch(e){
    alert('Could not read that file. Make sure it\'s a backup exported from this tracker.');
  }
}

function getAllItems(){
  return BASE_ITEMS.concat(customItems)
    .filter(i => !deletedIds[i.id])
    .map(i => overrides[i.id] ? { ...i, ...overrides[i.id] } : i);
}

function isReserve(item){
  return item.isNew && !activated[item.id];
}

function populateFilters(){
  const items = getAllItems();
  const colors = [...new Set(items.map(i => i.color))].sort();
  const brands = [...new Set(items.map(i => i.brand))].sort();
  const cSel = document.getElementById('filterColor');
  const bSel = document.getElementById('filterBrand');
  const ySel = document.getElementById('filterPurchaseYear');
  const dl = document.getElementById('colorSuggestions');
  const prevColor = cSel.value;
  const prevBrand = bSel.value;
  const prevYear = ySel.value;
  cSel.innerHTML = '<option value="">All colors</option>';
  bSel.innerHTML = '<option value="">All brands</option>';
  ySel.innerHTML = '<option value="">All purchase years</option>';
  dl.innerHTML = '';
  colors.forEach(c => {
    cSel.appendChild(new Option(c, c));
    dl.appendChild(new Option(c, c));
  });
  brands.forEach(b => bSel.appendChild(new Option(b, b)));
  const years = [...new Set(items
    .map(i => purchasedDates[i.id])
    .filter(Boolean)
    .map(ym => ym.split('-')[0])
  )].sort().reverse();
  years.forEach(y => ySel.appendChild(new Option(y, y)));
  ySel.appendChild(new Option('Not logged', 'unlogged'));
  if (colors.includes(prevColor)) cSel.value = prevColor;
  if (brands.includes(prevBrand)) bSel.value = prevBrand;
  if (prevYear && (years.includes(prevYear) || prevYear === 'unlogged')) ySel.value = prevYear;
}

function renderStats(){
  const items = getAllItems();
  const total = items.length;
  const reserveCount = items.filter(isReserve).length;
  const activeCount = total - reserveCount;

  const thisWeekStart = startOfWeekISO(0);
  const weekCount = Object.values(wearlog).filter(dates =>
    dates.length && dates[dates.length - 1] >= thisWeekStart
  ).length;

  const lastWeekStart = startOfWeekISO(-1);
  const lastWeekCount = Object.values(wearlog).filter(dates =>
    dates.some(d => d >= lastWeekStart && d < thisWeekStart)
  ).length;

  const stats = [
    {n: total, l:'Total items'},
    {n: activeCount, l:'Active rotation'},
    {n: reserveCount, l:'In reserve'},
    {n: weekCount, l:'Worn this week'},
    {n: lastWeekCount, l:'Worn last week'}
  ];
  document.getElementById('stats').innerHTML = stats.map(s =>
    `<div class="stat"><div class="n">${s.n}</div><div class="l">${s.l}</div></div>`
  ).join('');
}

function matchesFilters(item){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const color = document.getElementById('filterColor').value;
  const brand = document.getElementById('filterBrand').value;
  const purchaseYear = document.getElementById('filterPurchaseYear').value;
  if (color && item.color !== color) return false;
  if (brand && item.brand !== brand) return false;
  if (purchaseYear){
    const pd = purchasedDates[item.id];
    if (purchaseYear === 'unlogged'){
      if (pd) return false;
    } else {
      if (!pd || !pd.startsWith(purchaseYear)) return false;
    }
  }
  if (q){
    const hay = `${item.brand} ${item.type} ${item.color} ${item.material} ${item.code}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function escapeAttr(s){
  return String(s == null ? '' : s).replace(/"/g, '&quot;');
}

function escapeHTML(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function swatchPickerHTML(targetId, current){
  return Object.entries(COLOR_HEX).map(([name, hex]) => {
    const selected = name === current ? ' selected' : '';
    return `<button type="button" class="swatch-pick${selected}" style="background:${hex}" data-action="pick-color" data-target="${targetId}" data-color="${escapeAttr(name)}" title="${escapeAttr(name)}" aria-label="${escapeAttr(name)}"></button>`;
  }).join('');
}

        <div><label style="font-size:11px;color:var(--muted);">Purchased (month/year)</label>

          <textarea id="edit-notes-${item.id}" rows="2" style="width:100%;font-family:'Inter',sans-serif;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;">${escapeHTML(itemNotes[item.id] || '')}</textarea></div>

        <button class="btn small" data-action="cancel-edit" data-id="${item.id}">Cancel</button>

    </div>

  </div>`;

function cardHTML(item){
  if (editingId === item.id) return editFormHTML(item);

  const hex = displayHex(item);
  const dates = wearlog[item.id] || [];
  const count = dates.length;
  const last = count ? dates[count - 1] : null;

  let statusPill;
  if (isReserve(item)){
    statusPill = `<span class="pill reserve">Reserve</span>`;
  } else if (!last){
    statusPill = `<span class="pill overdue">Not logged yet</span>`;
  } else {
    const d = daysSince(last);
    if (d <= 14){
      statusPill = `<span class="pill recent">Worn ${d === 0 ? 'today' : d + 'd ago'}</span>`;
    } else {
      statusPill = `<span class="pill overdue">${d}d since worn</span>`;
    }
  }

  const wornToday = last === todayISO();
  const wearBtn = isReserve(item)
    ? `<button class="btn primary" data-action="activate" data-id="${item.id}">Activate</button>`
    : `<button class="btn primary" data-action="wear" data-id="${item.id}" ${wornToday ? 'disabled' : ''}>${wornToday ? 'Worn today' : 'Mark worn'}</button>`;

  const undoBtn = count
    ? `<button class="btn small" data-action="undo" data-id="${item.id}">Undo last</button>`
    : '';

  const editBtn = `<button class="btn small" data-action="edit" data-id="${item.id}">Edit</button>`;
  const deleteBtn = `<button class="btn ghost small" data-action="delete" data-id="${item.id}" title="Delete item" aria-label="Delete item">Delete</button>`;

  const chips = dates.slice().reverse().map(d =>
    `<span>${formatDate(d)}<button class="date-x" data-action="remove-date" data-id="${item.id}" data-date="${d}" title="Remove this date" aria-label="Remove this date">&times;</button></span>`
  ).join('');

  const historyBlock = `
    ${count
      ? `<details class="history">
           <summary>Worn ${count} time${count === 1 ? '' : 's'}</summary>
           <div class="history-dates">${chips}</div>
         </details>`
      : `<p class="meta" style="padding-left:6px;margin:0;">Worn 0 times</p>`}
    <div class="backdate-row">
      <input type="date" id="backdate-${item.id}" max="${todayISO()}">
      <button class="btn small" data-action="log-date" data-id="${item.id}">Log this date</button>
    </div>`;

  return `
  <div class="card" style="--tagcolor:${hex}; background: color-mix(in srgb, ${hex} 14%, var(--paper));">
    <div class="card-top">
      ${item.photo ? `<img src="${item.photo}" class="thumb" alt="">` : `<span class="swatch" style="background:${hex}"></span>`}
      <div class="titles">
        <div class="brand">${escapeHTML(item.brand)}</div>
        <div class="name">${escapeHTML(item.color)} ${escapeHTML(item.type)}</div>
      </div>
    </div>
    <div class="meta">${escapeHTML(item.material)}${item.code ? ' &middot; <code class="tagcode">' + escapeHTML(item.code) + '</code>' : ''}</div>
    ${purchasedDates[item.id] ? `<div class="meta" style="padding-left:6px;">Purchased ${formatMonthYear(purchasedDates[item.id])}</div>` : ''}
    ${itemNotes[item.id] ? `<div class="item-note">${escapeHTML(itemNotes[item.id])}</div>` : ''}
    ${historyBlock}
    <div class="status-row">
      ${statusPill}
      <div class="btn-row">
        ${wearBtn}
        ${undoBtn}
        ${editBtn}
        ${deleteBtn}
      </div>
    </div>
  </div>`;
}

function render(){
  renderStats();

  const items = getAllItems();
  const pool = items.filter(i => currentTab === 'reserve' ? isReserve(i) : !isReserve(i));
  const filtered = pool.filter(matchesFilters);

  const lastWorn = (id) => { const d = wearlog[id]; return d && d.length ? d[d.length - 1] : null; };
  const wearCount = (id) => (wearlog[id] || []).length;

  if (currentTab === 'active'){
    if (sortMode === 'most-worn'){
      filtered.sort((a,b) => wearCount(b.id) - wearCount(a.id));
      document.getElementById('sortlinetext').textContent = 'Sorted by most worn first.';
    } else if (sortMode === 'least-worn'){
      filtered.sort((a,b) => wearCount(a.id) - wearCount(b.id));
      document.getElementById('sortlinetext').textContent = 'Sorted by least worn first.';
    } else if (sortMode === 'last-worn'){
      filtered.sort((a,b) => {
        const la = lastWorn(a.id), lb = lastWorn(b.id);
        if (!la && !lb) return 0;
        if (!la) return 1;
        if (!lb) return -1;
        return daysSince(la) - daysSince(lb);
      });
      document.getElementById('sortlinetext').textContent = 'Sorted by most recently worn first.';
    } else if (sortMode === 'purchased-newest'){
      filtered.sort((a,b) => {
        const pa = purchasedDates[a.id], pb = purchasedDates[b.id];
        if (!pa && !pb) return 0;
        if (!pa) return 1;
        if (!pb) return -1;
        return pb.localeCompare(pa);
      });
      document.getElementById('sortlinetext').textContent = 'Sorted by most recently purchased first.';
    } else if (sortMode === 'purchased-oldest'){
      filtered.sort((a,b) => {
        const pa = purchasedDates[a.id], pb = purchasedDates[b.id];
        if (!pa && !pb) return 0;
        if (!pa) return 1;
        if (!pb) return -1;
        return pa.localeCompare(pb);
      });
      document.getElementById('sortlinetext').textContent = 'Sorted by oldest purchased first.';
    } else {
      filtered.sort((a,b) => {
        const la = lastWorn(a.id), lb = lastWorn(b.id);
        if (!la && !lb) return 0;
        if (!la) return -1;
        if (!lb) return 1;
        return daysSince(lb) - daysSince(la);
      });
      document.getElementById('sortlinetext').textContent = 'Sorted by most overdue for a wear first.';
    }
  } else {
    document.getElementById('sortlinetext').textContent = 'Items still held back as brand new.';
  }

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  if (filtered.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = filtered.map(cardHTML).join('');
  }
}

function setTab(tab){
  currentTab = tab;
  document.getElementById('tab-active').classList.toggle('active', tab === 'active');
  document.getElementById('tab-reserve').classList.toggle('active', tab === 'reserve');
  render();
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.dataset.id;
  const action = btn.dataset.action;

  if (action === 'wear'){
    const today = todayISO();
    if (!wearlog[id]) wearlog[id] = [];
    if (wearlog[id][wearlog[id].length - 1] !== today){
      wearlog[id].push(today);
      await saveWearlog();
      render();
    }
  } else if (action === 'undo'){
    if (wearlog[id] && wearlog[id].length){
      const removed = wearlog[id].pop();
      await saveWearlog();
      render();
    }
  } else if (action === 'log-date'){
    const input = document.getElementById(`backdate-${id}`);
    const val = input ? input.value : '';
    if (!val){ alert('Pick a date first.'); return; }
    if (val > todayISO()){ alert('Can\'t log a future date.'); return; }
    if (!wearlog[id]) wearlog[id] = [];
    if (wearlog[id].includes(val)){ alert('That date is already logged for this item.'); return; }
    wearlog[id].push(val);
    wearlog[id].sort();
    await saveWearlog();
    render();
  } else if (action === 'remove-date'){
    const date = btn.dataset.date;
    if (!wearlog[id]) return;
    if (!confirm(`Remove ${formatDate(date)} from this item's wear history?`)) return;
    wearlog[id] = wearlog[id].filter(d => d !== date);
    await saveWearlog();
    render();
  } else if (action === 'activate'){
    activated[id] = true;
    await saveActivated();
    render();
  } else if (action === 'edit'){
    editingId = id;
    render();
  } else if (action === 'pick-color'){
    const targetId = btn.dataset.target;
    const color = btn.dataset.color;
    const input = document.getElementById(targetId);
    if (input) input.value = color;
    const picker = btn.parentElement;
    if (picker){
      picker.querySelectorAll('.swatch-pick').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    }
  } else if (action === 'remove-photo'){
    const targetId = btn.dataset.target;
    const input = document.getElementById(targetId);
    if (input) input.value = '';
    const container = btn.parentElement.parentElement;
    if (container) container.innerHTML = '';
  } else if (action === 'cancel-edit'){
    editingId = null;
    render();
  } else if (action === 'save-edit'){
    const brand = document.getElementById(`edit-brand-${id}`).value.trim();
    const type = document.getElementById(`edit-type-${id}`).value.trim();
    const color = document.getElementById(`edit-color-${id}`).value.trim();
    const swatchColor = document.getElementById(`edit-swatchcolor-${id}`).value.trim();
    const material = document.getElementById(`edit-material-${id}`).value.trim();
    const code = document.getElementById(`edit-code-${id}`).value.trim();
    const photo = document.getElementById(`edit-photo-${id}`).value;
    const purchased = document.getElementById(`edit-purchased-${id}`).value; // "YYYY-MM" or ""
    const notes = document.getElementById(`edit-notes-${id}`).value.trim();
    if (!brand || !type || !color){
      alert('Brand, type, and color can\'t be empty.');
      return;
    }
    overrides[id] = { brand, type, color, swatchColor, material: material || 'Unspecified', code, photo };
    if (purchased) purchasedDates[id] = purchased; else delete purchasedDates[id];
    if (notes) itemNotes[id] = notes; else delete itemNotes[id];
    await Promise.all([saveOverrides(), savePurchasedDates(), saveItemNotes()]);
    editingId = null;
    populateFilters();
    render();
  } else if (action === 'delete'){
    const items = getAllItems();
    const item = items.find(i => i.id === id);
    const label = item ? `${item.brand} ${item.color} ${item.type}` : 'this item';
    if (!confirm(`Delete ${label} from your inventory? Its wear history will also be removed. This can't be undone.`)) return;
    deletedIds[id] = true;
    delete wearlog[id];
    delete activated[id];
    delete overrides[id];
    delete purchasedDates[id];
    delete itemNotes[id];
    if (editingId === id) editingId = null;
    await Promise.all([saveDeletedIds(), saveWearlog(), saveActivated(), saveOverrides(), savePurchasedDates(), saveItemNotes()]);
    populateFilters();
    render();
  }
});

document.addEventListener('change', async (e) => {
  const target = e.target;
  if (!(target.tagName === 'INPUT' && target.type === 'file')) return;
  const file = target.files && target.files[0];
  if (!file) return;

  let removeBgCheckbox = null;
  if (target.id === 'f-photo-input'){
    removeBgCheckbox = document.getElementById('f-remove-bg');
  } else if (target.id.startsWith('edit-photo-input-')){
    const itemId = target.id.slice('edit-photo-input-'.length);
    removeBgCheckbox = document.getElementById(`edit-removebg-${itemId}`);
  }
  const removeBg = removeBgCheckbox ? removeBgCheckbox.checked : false;

  let dataUrl;
  try {
    dataUrl = await fileToThumbnail(file, 200, 0.72, removeBg);
  } catch (err) {
    alert('Could not process that image. Try a different photo.');
    return;
  }

  if (target.id === 'f-photo-input'){
    document.getElementById('f-photo').value = dataUrl;
    document.getElementById('f-photo-preview').innerHTML = photoPreviewHTML(dataUrl, 'f-photo');
  } else if (target.id.startsWith('edit-photo-input-')){
    const itemId = target.id.slice('edit-photo-input-'.length);
    const fieldId = `edit-photo-${itemId}`;
    document.getElementById(fieldId).value = dataUrl;
    document.getElementById(`edit-photo-preview-${itemId}`).innerHTML = photoPreviewHTML(dataUrl, fieldId);
  }
});

document.getElementById('tab-active').addEventListener('click', () => setTab('active'));
document.getElementById('tab-reserve').addEventListener('click', () => setTab('reserve'));
document.getElementById('search').addEventListener('input', render);
document.getElementById('filterColor').addEventListener('change', render);
document.getElementById('filterBrand').addEventListener('change', render);
document.getElementById('filterPurchaseYear').addEventListener('change', render);
document.getElementById('sortMode').addEventListener('change', (e) => {
  sortMode = e.target.value;
  render();
});
document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!confirm('Clear all logged wear dates? This cannot be undone.')) return;
  wearlog = {};
  await saveWearlog();
  render();
});

document.getElementById('exportBtn').addEventListener('click', handleExport);
document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) handleImportFile(file);
  e.target.value = '';
});

// Add-item panel
const addPanel = document.getElementById('addPanel');
document.getElementById('toggleAddBtn').addEventListener('click', () => {
  addPanel.classList.toggle('open');
});
document.getElementById('cancelAddBtn').addEventListener('click', () => {
  addPanel.classList.remove('open');
  clearAddForm();
});
function clearAddForm(){
  ['f-brand','f-type','f-color','f-swatch-color','f-material','f-code','f-photo','f-purchased','f-notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-isnew').checked = false;
  document.getElementById('f-remove-bg').checked = true;
  document.getElementById('f-color-picker').innerHTML = swatchPickerHTML('f-swatch-color', '');
  document.getElementById('f-photo-preview').innerHTML = '';
  document.getElementById('f-photo-input').value = '';
}
document.getElementById('saveItemBtn').addEventListener('click', async () => {
  const brand = document.getElementById('f-brand').value.trim();
  const type = document.getElementById('f-type').value.trim();
  const color = document.getElementById('f-color').value.trim();
  const swatchColor = document.getElementById('f-swatch-color').value.trim();
  const material = document.getElementById('f-material').value.trim();
  const code = document.getElementById('f-code').value.trim();
  const photo = document.getElementById('f-photo').value;
  const purchased = document.getElementById('f-purchased').value; // "YYYY-MM" or ""
  const notes = document.getElementById('f-notes').value.trim();
  const isNew = document.getElementById('f-isnew').checked;

  if (!brand || !type || !color){
    alert('Please fill in at least brand, type, and color.');
    return;
  }

  const id = 'custom' + Date.now() + Math.floor(Math.random() * 1000);
  customItems.push({ id, brand, type, material: material || 'Unspecified', color, swatchColor, code, photo, isNew });
  if (purchased) purchasedDates[id] = purchased;
  if (notes) itemNotes[id] = notes;
  await Promise.all([saveCustomItems(), savePurchasedDates(), saveItemNotes()]);
  clearAddForm();
  addPanel.classList.remove('open');
  populateFilters();
  render();
});

(async function init(){
  try {
    document.getElementById('todayline').textContent =
      new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    document.getElementById('f-color-picker').innerHTML = swatchPickerHTML('f-swatch-color', '');
    try {
      await withTimeout(loadState(), 3000);
    } catch(e){
      wearlog = {}; activated = {}; customItems = []; deletedIds = {}; overrides = {}; purchasedDates = {}; itemNotes = {}; storageMode = 'memory';
    }
    populateFilters();
    updateStorageNote();
    render();
  } catch(err){
    document.getElementById('todayline').textContent = 'Something went wrong loading this tracker.';
    document.getElementById('stats').innerHTML =
      `<div style="grid-column:1/-1; background:var(--rust-tint); color:var(--rust); border-radius:10px; padding:12px 14px; font-size:13px;">
        Error: ${(err && err.message) ? err.message : String(err)}
      </div>`;
  }
})();
</script>
